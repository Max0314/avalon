<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,interactive-widget=resizes-content">
  <meta name="theme-color" content="#111217">
  <meta name="description" content="与朋友围坐圆桌：在线好友局、离线扫码组网，共同体验阿瓦隆。">
  <title>阿瓦隆 · Fribench 圆桌议会</title>
  <link rel="icon" href="/icons/app-icon.png">
  <link rel="manifest" href="/manifest.json">
  <link rel="stylesheet" href="/assets/styles.css">
  <script type="module" src="/assets/app.js"></script>
</head>
<body>
  <header class="site-header">
    <a class="brand" href="/" id="brand-home"><span class="brand-mark" aria-hidden="true"></span><span>阿瓦隆<small>圆桌议会</small></span></a>
    <nav class="header-actions" aria-label="游戏导航">
      <span class="network-state" id="network-state" role="status" data-state="connecting">正在连接</span>
      <button id="retry-online" class="header-button" hidden>重连</button>
      <button class="header-button" id="guide">手册</button>
      <button class="header-button" id="audio-settings" aria-label="声音设置"><span aria-hidden="true">♫</span></button>
      <button class="header-button" id="identity-header" hidden>我的身份</button>
      <button class="header-button" id="account-menu">账号</button>
    </nav>
  </header>
  <main id="app"><section class="loading" role="status">正在准备圆桌…</section></main>
  <footer class="site-footer"><a href="https://beian.miit.gov.cn/" target="_blank" rel="noopener noreferrer">渝ICP备2026016967号-1</a><a href="https://www.beian.gov.cn/portal/registerSystemInfo?recordcode=50010502504754" target="_blank" rel="noopener noreferrer">渝公网安备50010502504754号</a></footer>
  <dialog id="modal" aria-labelledby="modal-title">
    <header id="modal-heading"><h2 id="modal-title" class="dialog-title"></h2><button id="modal-close" class="dialog-close" aria-label="关闭弹窗">×</button></header>
    <div id="modal-body"></div>
    <div id="modal-actions" class="actions-row" hidden></div>
    <div id="modal-feedback" class="modal-feedback" role="status" hidden></div>
    <div id="modal-round" hidden></div>
  </dialog>
  <div id="toast" class="toast" role="status" hidden></div>
  <noscript>请开启浏览器 JavaScript 后再进入牌桌。</noscript>
</body>
</html>
